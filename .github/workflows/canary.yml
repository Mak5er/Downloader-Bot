name: Daily Platform Canary Check

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp -r requirements.txt

      - name: Set up YouTube cookies
        if: env.YOUTUBE_COOKIES != ''
        run: |
          mkdir -p cookies
          printf "%s\n" "$YOUTUBE_COOKIES" > cookies/youtube.txt
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

      - name: Run platform canary checks
        run: python scripts/canary_test.py
        env:
          YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
          PYTHONPATH: ${{ github.workspace }}
